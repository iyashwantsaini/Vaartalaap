name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys both services on every push to main.
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   RENDER_DEPLOY_HOOK_URL  — full URL from Render service → Settings → Deploy Hook
#   VERCEL_TOKEN            — https://vercel.com/account/tokens
#   VERCEL_ORG_ID           — from `vercel link` (.vercel/project.json) or dashboard
#   VERCEL_PROJECT_ID       — same source
jobs:
  deploy-api:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    steps:
      - name: Hit Render deploy hook
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-client:
    name: Build & deploy SPA to Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --legacy-peer-deps
      - run: npm install --global vercel@latest
      - name: Pull Vercel env (prod)
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
